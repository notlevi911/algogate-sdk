<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Algo DeFi Safety Settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">Settings</p>
        <h1>Algo DeFi Safety Layer</h1>
      </header>

      <section class="card">
        <h2>Gemini</h2>
        <p class="helper-text">
          The Gemini API key is loaded from <code>extension/.env</code>.
        </p>
        <label>
          Model
          <input id="gemini-model" type="text" value="gemini-2.5-flash" />
        </label>
      </section>

      <section class="card">
        <h2>Algorand wallet</h2>
        <p class="helper-text">
          The extension now uses its own embedded wallet flow. Open wallet setup to create
          or import your recovery phrase.
        </p>
        <label>
          Network
          <input id="network" type="text" value="testnet" readonly />
        </label>
      </section>

      <section class="card">
        <h2>x402 UX</h2>
        <label class="checkbox">
          <input id="x402-enabled" type="checkbox" />
          Enable x402-style premium prompts in the UI
        </label>
      </section>

      <div class="actions">
        <button id="save-settings">Save settings</button>
        <button id="open-wallet-setup" type="button">Open wallet setup</button>
        <span id="status-text"></span>
      </div>
    </main>
    <script src="./options.js"></script>
  </body>
</html>
