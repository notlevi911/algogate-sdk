<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EtherX Settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">EtherX Settings</p>
        <h1>EtherX</h1>
      </header>

      <section class="card">
        <h2>Gemini</h2>
        <p class="helper-text">
          The Gemini API key is loaded from <code>extension/.env</code> and can be tuned here.
        </p>
        <label>
          Model
          <input id="gemini-model" type="text" value="gemini-2.5-flash" />
        </label>
      </section>

      <section class="card">
        <h2>Wallet</h2>
        <p class="helper-text">
          EtherX uses its own embedded wallet flow. Open wallet setup to create
          or import your recovery phrase.
        </p>
        <label>
          Payment network
          <input id="network" type="text" value="Algorand" readonly />
        </label>
      </section>

      <section class="card">
        <h2>Premium unlocks</h2>
        <label class="checkbox">
          <input id="x402-enabled" type="checkbox" />
          Enable premium payment prompts in the UI
        </label>
      </section>

      <div class="actions">
        <button id="save-settings">Save settings</button>
        <button id="open-wallet-setup" type="button">Open wallet setup</button>
        <span id="status-text"></span>
      </div>
    </main>
    <script src="./options.js"></script>
  </body>
</html>
