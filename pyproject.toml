[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algogate"
version = "0.1.0"
description = "Paywall FastAPI routes with Algorand micropayments and a scaffolded Chrome wallet extension."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "AlgoGate" }
]
keywords = ["algorand", "fastapi", "payments", "micropayments", "x402", "chrome-extension"]
dependencies = [
  "fastapi>=0.110.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "websockets>=12.0",
  "uvicorn>=0.29.0",
]

[tool.setuptools]
packages = ["algogate"]
