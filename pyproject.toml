[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algogate-sdk"
version = "0.1.1"
description = "Paywall FastAPI routes with Algorand micropayments and a scaffolded Chrome wallet extension."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "AlgoGate" }
]
keywords = ["algorand", "fastapi", "payments", "micropayments", "x402", "chrome-extension"]
dependencies = [
  "fastapi>=0.110.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "websockets>=12.0",
  "uvicorn>=0.29.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/notlevi911/ether-browser/tree/sdk"
Documentation = "https://github.com/notlevi911/ether-browser/tree/sdk/algogate-sdk"
Repository = "https://github.com/notlevi911/ether-browser"
Issues = "https://github.com/notlevi911/ether-browser/issues"

[tool.setuptools]
packages = ["algogate"]
include-package-data = true
